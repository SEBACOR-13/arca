# push a main -> lint -> pruebas -> docker build -> deploy en Render
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Revisar estilo con ruff
        run: ruff check app tests scripts
      - name: Ejecutar la suite de pruebas
        run: pytest -v
      - name: Validar que la imagen Docker construye
        run: docker build -t arca:${{ github.sha }} .

  desplegar:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Disparar el deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Falta el secret RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$HOOK")
          echo "Render respondio HTTP $codigo"
          [ "$codigo" = "200" ] || exit 1

      - name: Esperar a que el servicio quede sano
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "No hay variable APP_URL; se omite la verificacion."
            exit 0
          fi
          for intento in $(seq 1 30); do
            respuesta=$(curl -fsS "$APP_URL/health" 2>/dev/null || true)
            if echo "$respuesta" | grep -q '"status":"ok"'; then
              echo "Servicio sano: $respuesta"
              # No basta con que responda: tiene que ver la base de datos.
              if echo "$respuesta" | grep -q '"backend":"astra"'; then
                echo "Conectado a Astra DB."
                exit 0
              fi
              echo "ERROR: responde, pero sin conexion a Astra."
              exit 1
            fi
            echo "  intento $intento: aun no responde"
            sleep 10
          done
          echo "El servicio no quedo sano tras 5 minutos."
          exit 1
